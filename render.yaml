# Render Infrastructure as Code (Blueprint)
# Celebration & Event Planner — Backend REST API
version: "1"
services:
  - type: web
    name: celebration-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm run build:api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_TIMEOUT_MS
        value: 25000
      - key: ALLOW_MOCK_IN_PRODUCTION
        value: false
